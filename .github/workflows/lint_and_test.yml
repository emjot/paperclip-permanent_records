name: Lint & Test

on: push

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y libsqlite3-dev
      - uses: actions/checkout@master
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.11
          rubygems: latest
          bundler: 2.7
      - name: Install bundle
        run: bundle
      - name: Run rubocop
        run: bundle exec rubocop
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - 3.2.11
          - 3.3.11
          - 3.4.10
          - 4.0.6
        appraisal:
          - rails_7.1
          - rails_7.2
          - rails_8.0
          - rails_8.1
    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y libsqlite3-dev
      - uses: actions/checkout@master
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: latest
          bundler: 2.7
      - name: Install bundle
        run: bundle
      - name: Install appraisal
        run: bundle exec appraisal ${{ matrix.appraisal }} bundle install
      - name: Run tests
        run: bundle exec appraisal ${{ matrix.appraisal }} rspec
